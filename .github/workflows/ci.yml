name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Standalone tests
        run: python3 tests/test_whenitruns.py
      - name: Pytest
        run: |
          pip install pytest
          pytest tests/ -q
      - name: Smoke on real system files
        run: |
          python3 whenitruns.py /etc/crontab --json | python3 -m json.tool > /dev/null
          python3 whenitruns.py --expr "30 3 * * 0"
